# TEMPORARY ([LW-FIGSEL-FLAKE], 28 Sep 26) — reproduces the Leave War figure-drag test's GitHub-only failure with a
# text probe (no pictures uploaded: [CI-FAIL-PICTURES] is his call). Deleted before this branch's PR.
name: figsel probe
on:
  push:
    branches: [claude/lw-figsel-flake]
    paths: ['.github/workflows/figsel-probe.yml', 'raptor-port/e2e/**', 'raptor-port/src/**']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        leg: [repeat, full]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: raptor-port/package-lock.json
      - name: Install
        working-directory: raptor-port
        run: npm ci
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('raptor-port/package-lock.json') }}
      - name: Install Chromium
        working-directory: raptor-port
        run: npx playwright install --with-deps chromium
      - name: Top bar measure
        working-directory: raptor-port
        run: node -e "console.log('fonts:'); require('child_process').execSync('fc-match sans-serif; fc-match system-ui', {stdio:'inherit'})" || true
      - name: Probe
        working-directory: raptor-port
        env:
          FIGSEL_PROBE: '1'
        run: |
          if [ "${{ matrix.leg }}" = repeat ]; then
            npx playwright test --project=lw-desktop -g "subtracts; 0, abc" --repeat-each=24 --retries=0 || true
          else
            npx playwright test --project=lw-desktop --retries=0 || true
          fi
