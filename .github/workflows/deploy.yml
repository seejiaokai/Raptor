# Build the React port and publish it to GitHub Pages on every push to main.
# The same gates also run on every pull request into main, so a red PR is
# caught BEFORE merge — previously they only ran after, and the PR's only
# checks were Vercel's (owner ask, Aug 5). Publishing stays push-to-main only.
# One-time setup in the repo: Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Main deploys keep the single serialized "pages" group. PR runs get a group
# per PR instead of joining it — inside one shared group, cancel-in-progress
# would let a PR run cancel a real deploy mid-flight.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: raptor-port/package-lock.json
      - name: Install
        working-directory: raptor-port
        run: npm ci
      - name: Test
        working-directory: raptor-port
        run: npm test
      - name: Reference suite
        working-directory: raptor-port
        run: node reference/tfin.js
      - name: Build
        working-directory: raptor-port
        run: npm run build
      # jsdom has no layout engine, so the measured geometry contracts (puck
      # 74x15, free text wraps instead of overflowing, one day box per pan
      # click) can only be checked in a real browser. The runner has no
      # browser of its own; the dev container's Chromium is not here.
      - name: Install Chromium
        working-directory: raptor-port
        run: npx playwright install --with-deps chromium
      - name: Geometry
        working-directory: raptor-port
        run: npm run test:e2e
      # a PR run exists to gate, not to publish — no artifact, no deploy
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: raptor-port/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        # 20 minutes, not the action's default 10 (the input is milliseconds).
        # This step runs none of our code — it hands the built artifact to
        # GitHub Pages and waits for Pages to serve it — and for this repo that
        # wait sits around 8 minutes against a 10-minute limit. On 6 Aug 26 two
        # deploys in a row went a few seconds past it and the action CANCELLED
        # a deployment that was still progressing, so a green build published
        # nothing. The artifact is 0.15 MB and the repo is nowhere near the
        # 10-builds-per-hour soft limit, so the queue length is GitHub's to
        # decide and not ours to optimise; the only lever on our side is to
        # stop killing it early. Raise this again rather than re-running blind
        # if the wait ever grows past 20.
        with:
          timeout: 1200000
