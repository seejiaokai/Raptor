# Build the React port and publish it to GitHub Pages on every push to main.
# The same gates also run on every pull request into main, so a red PR is
# caught BEFORE merge — previously they only ran after, and the PR's only
# checks were Vercel's (owner ask, Aug 5). Publishing stays push-to-main only.
# One-time setup in the repo: Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

# Docs-only changes skip the whole workflow (15 Aug 26): nothing under these
# patterns reaches the built bundle (verified — no .md/.claude file is
# imported anywhere in src/), so a session-handoff or HANDOFF.md edit merges
# without a 5-minute gate and without a pointless Pages redeploy. The skip
# fires only when EVERY changed file matches; a PR mixing code and docs still
# runs the full gates.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.claude/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.claude/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Main deploys keep the single serialized "pages" group. PR runs get a group
# per PR instead of joining it — inside one shared group, cancel-in-progress
# would let a PR run cancel a real deploy mid-flight.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: raptor-port/package-lock.json
      - name: Install
        working-directory: raptor-port
        run: npm ci
      - name: Test
        working-directory: raptor-port
        run: npm test
      - name: Reference suite
        working-directory: raptor-port
        run: node reference/tfin.js
      - name: Build
        working-directory: raptor-port
        run: npm run build
      # jsdom has no layout engine, so the measured geometry contracts (puck
      # 74x15, free text wraps instead of overflowing, one day box per pan
      # click) can only be checked in a real browser. The runner has no
      # browser of its own; the dev container's Chromium is not here.
      # Cache the downloaded browser between runs, keyed on the lockfile so a
      # Playwright bump busts it. On a hit the ~20s Chromium download is
      # skipped; `--with-deps` still runs (the apt step is quick) so the OS
      # libraries are present on every fresh runner.
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('raptor-port/package-lock.json') }}
      - name: Install Chromium
        working-directory: raptor-port
        run: npx playwright install --with-deps chromium
      - name: Geometry
        working-directory: raptor-port
        run: npm run test:e2e
      # a PR run exists to gate, not to publish — no artifact, no deploy
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: raptor-port/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        # DO NOT pass `timeout:` here expecting a longer wait — it is capped.
        # This step runs none of our code: it hands the built artifact to
        # GitHub Pages and polls until Pages serves it. On 6 Aug 26 three
        # deploys in a row died on `Timeout reached, aborting!` at ten minutes,
        # each CANCELLING a deployment that was still reporting progress, so a
        # green build published nothing. Raising the input does not help — the
        # action clamps it and says so in the log:
        #   "timeout value is greater than the allowed maximum
        #    - timeout set to the maximum of 600000 milliseconds"
        # Ten minutes is a hard ceiling. Ruled out on our side before blaming
        # the queue: the artifact is 0.15 MB over 5 files, the environment goes
        # waiting→queued→in_progress in 1–3s (no protection rule padding it),
        # and the repo ran 2 deployments in the hour against a documented soft
        # limit of 10. The same deploy took 8m04s and SUCCEEDED at 11:21 that
        # morning, so this is Pages' queue moving, not anything we changed.
        # If it stays over ten minutes, the fix is a different publish path
        # (a gh-pages branch, which never waits on the rollout, or another
        # host) — not another re-run and not another timeout value.
        uses: actions/deploy-pages@v4
