# Build the React port and publish it to GitHub Pages on every push to main.
# The same gates also run on every pull request into main, so a red PR is
# caught BEFORE merge — previously they only ran after, and the PR's only
# checks were Vercel's (owner ask, Aug 5). Publishing stays push-to-main only.
# One-time setup in the repo: Settings → Pages → Source: "GitHub Actions".
#
# THE GATES RUN AS PARALLEL JOBS, NOT ONE SERIAL JOB (owner ask, 3 Sep 26).
# Measured on the last single-job run (#354's publish, 17m26s end to end):
# install+build 20s, vitest 9m41s, Playwright 6m29s, the Pages publish 5s.
# So the merge-to-live wait was the two suites queued on one 4-core runner,
# and Leave War was most of both — its ten heaviest jsdom files were two
# thirds of the unit time (each test renders a 365-column year) and its two
# browser projects three quarters of the geometry time. Splitting by the
# projects each runner already defines (vitest: raptor / leavewar;
# Playwright: raptor / lw-phone / lw-desktop) puts each suite on its own
# runner (free while the repo was public — since D89 the default is ONE job
# on the owner's own PC, the `pc` job below; these split legs are the way back). `deploy`
# still waits on EVERY gate, so nothing publishes red. MEASURED on the first
# parallel PR run: 8m28s end to end (was 16m16s serial on the same tree) —
# build 41s, unit raptor 4m38s, unit leavewar 8m24s, geometry 2m29s / 3m17s
# / 3m07s. The Leave War unit leg was the long pole and slower than the
# arithmetic promised: its ten heavy jsdom files each want a whole core, so
# four side by side on a 4-core runner do not scale like the mixed serial
# run did. So that leg is SHARDED in two below (vitest `--shard` splits the
# file list by a hash of each path — a fixed split, not duration-aware; the
# two halves carry ~595 s / ~433 s of the serial run's per-file times, the
# heavy files 5/4). Expected critical path after the shard: ~5 min.
name: Deploy to GitHub Pages

# Docs-only changes skip the whole workflow (15 Aug 26): nothing under these
# patterns reaches the built bundle (verified — no .md/.claude file is
# imported anywhere in src/), so a session-handoff or HANDOFF.md edit merges
# without a 5-minute gate and without a pointless Pages redeploy. The skip
# fires only when EVERY changed file matches; a PR mixing code and docs still
# runs the full gates. The document gate's own files are skipped too (23 Sep 26,
# [DOCS-GUARD]): they are run by docs-guard.yml, and nothing in src/ imports
# them — without this, every edit to the guard would bill a full gate run.
# `.gitattributes` is NOT skipped any more (Fable CI-PATHS-001, 23 Sep 26): it decides the bytes every
# job checks out — line endings broke the PC runner's first trial — so a change to it runs the gates.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - 'raptor-port/scripts/docsize*.mjs'
      - 'raptor-port/scripts/backlog-archive.mjs'
      - '.github/workflows/docs-guard.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - 'raptor-port/scripts/docsize*.mjs'
      - 'raptor-port/scripts/backlog-archive.mjs'
      - '.github/workflows/docs-guard.yml'
  workflow_dispatch:

# Least privilege (Astra, 23 Sep 26): every job reads the code and nothing else.
# The Pages rights live on the `deploy` job alone, which is the only job that
# ever used them — the gates, and above all the one on the owner's own PC, must
# not carry a Pages-capable token or be able to ask for an OIDC one.
permissions:
  contents: read

# Main deploys keep the single serialized "pages" group. PR runs get a group
# per PR instead of joining it — inside one shared group, cancel-in-progress
# would let a PR run cancel a real deploy mid-flight.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: true

jobs:
  # THE GATES RUN ON THE OWNER'S OWN PC (D89, 23 Sep 26). When the repo went
  # private (D59) GitHub's machines for it halved — 2 cores instead of 4 — so
  # every parallel leg below doubled (desktop browser leg 5–6 → 10–11 min, the
  # scheduler's unit tests up to 20) and a run began billing ~60 minutes of the
  # monthly allowance ([CI-TWO-CORES]). He registered his Windows PC as a
  # self-hosted runner instead: free, and fast enough that ONE job running the
  # five gates in turn, each using the whole machine, beats the split legs.
  #   - THE WAY BACK: set the repository variable CI_ON_GITHUB to `true`
  #     (Settings → Secrets and variables → Actions → Variables) and the
  #     original split jobs below run on GitHub's machines instead — for when the
  #     PC is off: a job waiting for an offline runner fails after 24 hours.
  #     Known there (23 Sep 26): on the private repo's 2-core machine the two long
  #     Leave War scenarios in e2e/step4-leavewar.spec.ts timed out even after
  #     they were taught to wait on conditions (D87) — the likeliest lever is a
  #     ±1px tolerance in `gridAtRest` (e2e/app.ts), which watches a header to
  #     the pixel while the desktop's background fill can nudge it by ≤1px. A
  #     Leave War desktop timeout there earns ONE re-run of the failed group,
  #     not an investigation; a second failure is new evidence (D84).
  #   - PORTS: this PC also hosts the chats' previews on 4173/4180 (D86), so the
  #     browser gate and the Tracker smoke serve on their own ports here.
  #   - SHELL: cmd, not PowerShell — a machine's script policy can refuse the
  #     PowerShell wrapper, and cmd hands each step's exit code straight back.
  #     One gate per step, so a failure is named by the step that failed.
  #   - A check running here at the same moment as a chat's own full test run
  #     shares the processor, which can fail a timing-sensitive test (D86's
  #     reason): a red here while a chat was testing earns ONE re-run first.
  #   - WHO MAY RUN CODE ON HIS PC (Astra SEC-001, 23 Sep 26): only HIS OWN
  #     changes, in a PRIVATE repo — pushed by his account, from a branch of this
  #     repo, never a fork. A public repo, a fork's pull request or anyone else's
  #     run falls to GitHub's machines below instead (their `if` is the exact
  #     complement, so a run is never left with no gate). GitHub's own advice:
  #     almost never let a public repo reach a self-hosted runner.
  #     THIS GUARD IS NOT A WALL AGAINST ANYONE WHO CAN EDIT THIS FILE (Astra
  #     SEC-101, 23 Sep 26): a pull request runs the workflow as the PR itself
  #     wrote it, so a collaborator's PR could drop the `if` or add a job aimed
  #     at the PC. Today nobody but the owner can push, so it holds. BEFORE HE
  #     ADDS ANY COLLABORATOR (D59's stated plan): remove the runner from this
  #     repo first (Settings → Actions → Runners) and set CI_ON_GITHUB=true, or
  #     move the runner to a separate owner-only CI repo — `[REPO-PRIVATE]`.
  #   - REQUIRED CHECKS (Fable CI-REQ-001): none exist — a free private repo
  #     cannot have them (the API answers "Upgrade to GitHub Pro"), so merging
  #     rests on his "merge live" and the agent reading this run's result. If
  #     they ever exist, require `all gates (your PC)` AND the split names: a
  #     job skipped by its `if` reports Success to a required check.
  #   - THE RUNNER'S ACCOUNT (Astra SEC-002): never an Administrator. As a Windows
  #     service it runs under a restricted account (NETWORK SERVICE at least; a
  #     dedicated standard user with no access to his profile is better).
  #     DONE 23 Sep 26: the service `actions.runner.seejiaokai-Raptor.JK` runs as
  #     NT AUTHORITY\NETWORK SERVICE, starts with the PC, and lives in
  #     C:\actions-runner\actions-runner (one folder deeper than the first,
  #     hand-run copy, which is left unused in C:\actions-runner — so never
  #     delete C:\actions-runner itself). He installed it himself; its sign-up
  #     code is his credential (D89).
  #   - PORT_URL / APP_URL are pinned too (Astra CI-001): either one left in the
  #     machine's environment would point a gate at another checkout's preview.
  pc:
    name: all gates (your PC)
    if: >-
      vars.CI_ON_GITHUB != 'true'
      && github.event.repository.private
      && github.actor == github.repository_owner
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    env:
      E2E_PORT: '4273'
      PORT_URL: 'http://localhost:4273/'
      SMOKE_PORT: '4279'
      APP_URL: ''
      # A git credential prompt must FAIL at once, never wait (23 Sep 26): the runner is a service
      # with no screen, and the first run under it hung 30 minutes on Git's credential manager
      # (Playwright's git-info fetch — now switched off in playwright.config.ts; this is the belt).
      GIT_TERMINAL_PROMPT: '0'
      GCM_INTERACTIVE: 'never'
    defaults:
      run:
        shell: cmd
        working-directory: raptor-port
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # KEEP THE REPO'S OWN LINE ENDINGS (the first run on the PC, 23 Sep 26,
      # failed two unit files on exactly this). Git for Windows is installed
      # with core.autocrlf=true, so this fresh clone came out CRLF — while the
      # owner's own checkout says false in its .git/config, which is why every
      # local run passed. src/testing/refwin.ts patches the reference app by
      # exact text that spans a line break, and found nothing to patch. So: set
      # false for THIS clone only (never the owner's own Git settings) and lay
      # every file down again exactly as stored — LF where the repo is LF, and
      # the handful of CRLF files still CRLF, as on his desktop. Each line stops
      # the step on its own failure: cmd reports only the LAST command's code,
      # which would let a failed first line pass as success (Astra CI-002).
      - name: Keep the repo's own line endings
        working-directory: .
        run: |
          git config core.autocrlf false || exit /b 1
          git rm -r --cached --quiet . || exit /b 1
          git reset --hard --quiet HEAD || exit /b 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Reference suite
        run: node reference/tfin.js
      - name: Unit tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install chromium
      # six at a time, not the split legs' three: this is one job on a 16-thread
      # machine, with headroom left for the server and the owner's own work
      - name: Browser tests
        run: npx playwright test --workers=6
      - name: Tracker smoke
        run: npm run smoke:tracker

  # ---- GitHub's own machines: when CI_ON_GITHUB is `true`, or whenever the run
  # ---- is not the owner's own, in a private repo (the complement of `pc`) ----

  # Type-check + bundle, the 728-assertion parity suite, and (on main) the
  # artifact `deploy` publishes. Under a minute; the test jobs run beside it.
  build:
    if: >-
      vars.CI_ON_GITHUB == 'true'
      || !github.event.repository.private
      || github.actor != github.repository_owner
      || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: raptor-port/package-lock.json
      - name: Install
        working-directory: raptor-port
        run: npm ci
      - name: Build
        working-directory: raptor-port
        run: npm run build
      - name: Reference suite
        working-directory: raptor-port
        run: node reference/tfin.js
      # a PR run exists to gate, not to publish — no artifact, no deploy
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: raptor-port/dist

  # One runner per vitest project, and two for Leave War (see the header).
  # `npm test` locally still runs everything; here `--project` selects the
  # same two pools vite.config.ts defines (raptor 2541 tests, leavewar 1284 —
  # 3825 together, the gate count in HANDOFF) and `--shard` halves the
  # Leave War file list. fail-fast off so a red leg reports on its own
  # instead of cancelling the others half way through.
  unit:
    name: unit (${{ matrix.project }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    if: >-
      vars.CI_ON_GITHUB == 'true'
      || !github.event.repository.private
      || github.actor != github.repository_owner
      || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: raptor
          - project: leavewar
            shard: 1/2
          - project: leavewar
            shard: 2/2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: raptor-port/package-lock.json
      - name: Install
        working-directory: raptor-port
        run: npm ci
      - name: Test
        working-directory: raptor-port
        run: npx vitest run --project ${{ matrix.project }} ${{ matrix.shard && format('--shard={0}', matrix.shard) || '' }}

  # One runner per Playwright project. jsdom has no layout engine, so the
  # measured geometry contracts (puck 74x15, free text wraps instead of
  # overflowing, one day box per pan click) can only be checked in a real
  # browser. The runner has no browser of its own; the dev container's
  # Chromium is not here. Cache the downloaded browser between runs, keyed on
  # the lockfile so a Playwright bump busts it. On a hit the ~20s Chromium
  # download is skipped; `--with-deps` still runs (the apt step is quick) so
  # the OS libraries are present on every fresh runner. Each leg builds and
  # serves the port itself (playwright.config.ts webServer) and keeps the
  # 3-worker / one-retry CI settings from 15 Aug 26.
  geometry:
    name: geometry (${{ matrix.project }})
    if: >-
      vars.CI_ON_GITHUB == 'true'
      || !github.event.repository.private
      || github.actor != github.repository_owner
      || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [raptor, lw-phone, lw-desktop]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: raptor-port/package-lock.json
      - name: Install
        working-directory: raptor-port
        run: npm ci
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('raptor-port/package-lock.json') }}
      - name: Install Chromium
        working-directory: raptor-port
        run: npx playwright install --with-deps chromium
      - name: Geometry
        working-directory: raptor-port
        run: npx playwright test --project=${{ matrix.project }}

  # The vendored OCU Progress Tracker's own browser suite (7 Sep 26, the
  # Tracker merge) — 345 checks from the standalone repo, driven through
  # Raptor's login and tab (scripts/tracker/smoke.mjs). Its own job so it
  # runs beside the geometry legs rather than after them; it builds and
  # serves the bundle itself like they do.
  tracker:
    name: tracker (smoke)
    if: >-
      vars.CI_ON_GITHUB == 'true'
      || !github.event.repository.private
      || github.actor != github.repository_owner
      || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: raptor-port/package-lock.json
      - name: Install
        working-directory: raptor-port
        run: npm ci
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('raptor-port/package-lock.json') }}
      - name: Install Chromium
        working-directory: raptor-port
        run: npx playwright install --with-deps chromium
      - name: Tracker smoke
        working-directory: raptor-port
        run: npm run smoke:tracker

  # Publishes only when every gate above is green: a failed or cancelled
  # `needs` job skips this one, so nothing deploys red.
  #
  # OFF SINCE 23 Sep 26, when the repo went PRIVATE (D59). GitHub Pages cannot
  # serve from a private repo on the free plan — the Pages site is gone (the
  # API returns 404), so this job would fail on every push AND still bill its
  # Actions minutes, which are metered now that the repo is private (~37 billed
  # minutes a push, measured 23 Sep 26). The gates above still run and still
  # block a red merge; only the PUBLISH is disabled. The live app is served by
  # VERCEL instead. To turn Pages back on: make the repo public again (or buy a
  # plan that serves private Pages), drop the `false &&` below, AND make sure the
  # gates run on GitHub's machines — since D89 the default gate is the `pc` job,
  # which uploads no Pages artifact, and a skipped `needs` job skips this one
  # (Astra CI-003). A public repo already routes the gates there (the guard on
  # `pc`); a private one needs CI_ON_GITHUB=true.
  deploy:
    needs: [build, unit, geometry, tracker]
    if: false && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        # DO NOT pass `timeout:` here expecting a longer wait — it is capped.
        # This step runs none of our code: it hands the built artifact to
        # GitHub Pages and polls until Pages serves it. On 6 Aug 26 three
        # deploys in a row died on `Timeout reached, aborting!` at ten minutes,
        # each CANCELLING a deployment that was still reporting progress, so a
        # green build published nothing. Raising the input does not help — the
        # action clamps it and says so in the log:
        #   "timeout value is greater than the allowed maximum
        #    - timeout set to the maximum of 600000 milliseconds"
        # Ten minutes is a hard ceiling. Ruled out on our side before blaming
        # the queue: the artifact is 0.15 MB over 5 files, the environment goes
        # waiting→queued→in_progress in 1–3s (no protection rule padding it),
        # and the repo ran 2 deployments in the hour against a documented soft
        # limit of 10. The same deploy took 8m04s and SUCCEEDED at 11:21 that
        # morning, so this is Pages' queue moving, not anything we changed.
        # (By 3 Sep 26 the same step was taking 5 seconds — the ceiling is a
        # trap that bites when Pages' queue is slow, not a cost we pay daily.)
        # If it stays over ten minutes, the fix is a different publish path
        # (a gh-pages branch, which never waits on the rollout, or another
        # host) — not another re-run and not another timeout value.
        uses: actions/deploy-pages@v4
