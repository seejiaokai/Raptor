# THE DOCUMENT GATE IN CI — [DOCS-GUARD] F1 (Fable's attack on D29, 22 Sep 26; owner D30).
#
# deploy.yml skips every change made only of `**.md` and `.claude/**` (nothing there reaches the
# built app), which meant a docs-only pull request ran ZERO checks: one that deleted half the
# backlog would have merged unexamined. This job is that missing check, and it is deliberately
# small — no install, no build, just Node and git — because the repo is PRIVATE since 23 Sep 26
# (D59) and every run bills Actions minutes (about three per run since 28 Sep 26).
#
# It runs the gate's own self-test first (proof it still catches a destroyed record), then the gate
# against the change's base: the PR's base commit, or the previous tip of main on a push.
name: Docs guard

on:
  # NO path filter (Astra, 23 Sep 26): the gate reads more than docs — rulecheck.mjs's rule map, and
  # any file a ruling names as its home, which can be a source file a code-only PR deletes. So it
  # runs on every PR and every push to main. It is two to three billed minutes against the full gates' ~37.
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs-guard:
    runs-on: ubuntu-latest
    # 5 -> 10, 28 Sep 26 (owner, in the same request as D391's guide step): the self-test grew to ~180 cases with real `git merge` fixtures in
    # the rulings slim-down (D390) and now takes two to three minutes here, so five left no room for a slow runner.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the gate reads the base versions of the backlog with `git show`
      - name: Self-test — the gate still catches a destroyed record
        run: node raptor-port/scripts/docsize-selftest.mjs
      # The "checks passed" script's own tests (chat 27, 8 Nov 26 — the Opus read): among them, its notes-only list
      # held equal to deploy.yml's push list. Here because this job runs on every pull request, notes-only ones too.
      - name: The "checks passed" script's tests
        run: node --test raptor-port/scripts/ci/checks-passed.test.mjs
      # The records' settle step's own tests (chat 33, 8 Nov 26 — [MERGE-ONCE-RECORDS]): each builds a throwaway repo and
      # makes a real clashing merge (about 45 s). Here for the same reason: the script is on the notes-only list, so a
      # change to it skips the gates and only this job would see it break.
      - name: The records' settle step's tests
        run: node --test raptor-port/scripts/records-merge.test.mjs
      # Vercel's skip-the-build check's own tests (chat 71, 13 Nov 26 — his D2032, [VERCEL-SKIP-NOTES]): a few seconds.
      # Here so every pull request runs them — a wrong skip would leave the live app stale.
      - name: Vercel's skip-the-build check's tests
        run: node --test raptor-port/scripts/vercel-ignore.test.mjs
      - name: Inventory and ceilings against the base
        env:
          DOCSGUARD_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node raptor-port/scripts/docsize.mjs
