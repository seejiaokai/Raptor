# THE SECRETS SCAN — his D1408 (27 Oct 26), [REVIEW-LAYERS] step 4: "GitHub's checks gain a secrets scan that stops a
# pull request from merging when a password, key or access code is found in its files, and the project's whole history
# is scanned once; a key found in the history is changed, not only deleted."
#
# The scanner: gitleaks (github.com/gitleaks/gitleaks, MIT licence — free for any use, a personal public repository
# included; the separate gitleaks-ACTION needs a paid licence key for an organisation's repositories, so it is NOT
# used: the program itself is downloaded, pinned to an exact version and checked against its published checksum).
# v8.30.1, released 21 Mar 26.
#
# The repository is PUBLIC (D106), so this run's log is readable by anyone. So: every gitleaks run passes --redact
# (the secret becomes "REDACTED" in its output and its report), nothing is ever run --verbose or at debug level (that
# level logs the secret itself), the report is never uploaded, and the summary prints only the rule, the file, the
# line, the commit and the fingerprint — never a line of the file. The self-test below proves the redaction on every
# run, before the real scan, with a planted fake.
#
# What it scans:
#   - a pull request: every commit the pull request adds (base..head), each commit's added lines;
#   - a push to main: the commits that push brought (before..after);
#   - the WHOLE HISTORY — every commit of every branch — on a manual run (Actions -> Secrets scan -> Run workflow),
#     and by itself on any pull request or push that changes the scan's own files (this workflow, .gitleaksignore,
#     the self-test). That is how the one scan of the whole history D1408 asks for runs on the very pull request that
#     brings this file, before it reaches main, and again when it lands.
# What turns the check RED: a finding in the CHANGE (the merge gate D1408 asks for — a pull request that adds a key does
# not merge), and on a MANUAL run a finding anywhere in the history. A history finding met on a pull request or a push
# is reported — a warning on the run and every fingerprint in its summary — but does not hold that pull request back:
# it is old, the pull request did not add it, and what it needs is a decision (change the key, or list it as not a
# secret), not a blocked merge. The walk logs hold the app's own random record ids, which can read as keys; expect some.
# Pictures, video and other binary files are left out of the git read (git's own pathspec): gitleaks skips them anyway
# (its default rules allow-list most of those types, and git shows no text of the rest), and on a change scan leaving them out spares fetching the pictures it adds.
#
# NO path filter, on purpose (D1408): deploy.yml skips a notes-only change, and a key pasted into a note is the likeliest
# leak of all. How to read a red run, and what to do: raptor-port/docs/gates-and-deploy.md §Now (D1408).
name: Secrets scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    name: secrets scan
    runs-on: ubuntu-24.04
    # The change scans take a minute or two. A whole-history read downloads the full history first (about 4.3 GB,
    # pictures included — git cannot leave a file type out of a download) and reads every commit: not yet measured;
    # 45 minutes is room for it, to be cut once the first run's time is known.
    timeout-minutes: 45
    env:
      GITLEAKS_VERSION: '8.30.1'
      # gitleaks_8.30.1_linux_x64.tar.gz, from the release's own gitleaks_8.30.1_checksums.txt (read 31 Oct 26).
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
    steps:
      # The whole history's commits and folders, but no file's contents until git needs them (a "blobless" clone), and
      # only the two files this job reads laid down in the folder — so a change scan never fetches the 4.4 GB of pictures.
      # The read-only token stays in git's settings so the lazy fetches still work if the repo goes private again.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitleaksignore
            /raptor-port/scripts/secrets-scan-selftest.mjs

      - name: Install gitleaks (pinned version, checksum checked)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" version

      - name: Self-test — a planted fake is caught, and none of it is printed
        run: node raptor-port/scripts/secrets-scan-selftest.mjs "$RUNNER_TEMP/gitleaks/gitleaks"

      - name: Decide what to scan
        id: what
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) from="$PR_BASE"; to="$PR_HEAD" ;;
            push)
              to="$GITHUB_SHA"
              if [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then from="$to~1"; else from="$PUSH_BEFORE"; fi ;;
            *) from=""; to="" ;;
          esac
          history=no
          range=""
          if [ -z "$to" ]; then
            history=yes
          else
            range="$from..$to"
            # The list is read whole first: `grep -q` stops early, and under pipefail that could read as "no match".
            changed=$(git diff --name-only "$from...$to")
            if printf '%s\n' "$changed" | grep -xE '\.github/workflows/secrets-scan\.yml|\.gitleaksignore|raptor-port/scripts/secrets-scan-selftest\.mjs' > /dev/null; then
              history=yes
            fi
          fi
          echo "range=$range" >> "$GITHUB_OUTPUT"
          echo "history=$history" >> "$GITHUB_OUTPUT"
          echo "Change range: ${range:-none (a manual run)}; whole history: $history"

      # gitleaks splits --log-opts on spaces and passes them to `git log -p -U0`; the pathspec after `--` leaves the
      # binary files out (see the head of this file). --diff-filter=tuxdb is gitleaks' own default, kept.
      - name: Scan the change
        if: steps.what.outputs.range != ''
        env:
          RANGE: ${{ steps.what.outputs.range }}
        run: |
          set -uo pipefail
          SKIP=':(exclude,icase)*.png :(exclude,icase)*.jpg :(exclude,icase)*.jpeg :(exclude,icase)*.gif :(exclude,icase)*.webp :(exclude,icase)*.bmp :(exclude,icase)*.tif :(exclude,icase)*.tiff :(exclude,icase)*.ico :(exclude,icase)*.mp4 :(exclude,icase)*.webm :(exclude,icase)*.mov :(exclude,icase)*.pdf :(exclude,icase)*.pptx :(exclude,icase)*.docx :(exclude,icase)*.xlsx :(exclude,icase)*.zip :(exclude,icase)*.woff :(exclude,icase)*.woff2 :(exclude,icase)*.ttf :(exclude,icase)*.otf'
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --redact --no-banner --exit-code 1 --report-format json --report-path "$RUNNER_TEMP/change.json" --log-opts="--full-history --diff-filter=tuxdb $RANGE -- . $SKIP"
          status=$?
          node -e '
            const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8") || "[]")
            const lines = r.map((f) => `- ${f.RuleID} in ${f.File} line ${f.StartLine}, commit ${String(f.Commit).slice(0, 12)} — fingerprint ${f.Fingerprint}`)
            const head = r.length ? `### Secrets scan: ${r.length} found in this change (values redacted)` : "### Secrets scan: nothing found in this change"
            console.log([head, ...lines].join("\n"))
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, [head, ...lines, ""].join("\n"))
          ' "$RUNNER_TEMP/change.json" || true
          exit $status

      - name: Scan the whole history (every commit of every branch)
        if: steps.what.outputs.history == 'yes'
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail
          SKIP=':(exclude,icase)*.png :(exclude,icase)*.jpg :(exclude,icase)*.jpeg :(exclude,icase)*.gif :(exclude,icase)*.webp :(exclude,icase)*.bmp :(exclude,icase)*.tif :(exclude,icase)*.tiff :(exclude,icase)*.ico :(exclude,icase)*.mp4 :(exclude,icase)*.webm :(exclude,icase)*.mov :(exclude,icase)*.pdf :(exclude,icase)*.pptx :(exclude,icase)*.docx :(exclude,icase)*.xlsx :(exclude,icase)*.zip :(exclude,icase)*.woff :(exclude,icase)*.woff2 :(exclude,icase)*.ttf :(exclude,icase)*.otf'
          # The clone above holds no file contents; reading every commit by fetching each one's files as it comes would
          # be thousands of round trips. So the whole history is downloaded once, in one go (the 1 GB limit leaves out
          # nothing: no file here comes near it). Tried on a small blobless clone, 31 Oct 26: every missing file came.
          git fetch --quiet --refetch --no-tags --filter=blob:limit=1g origin '+refs/heads/*:refs/remotes/origin/*' || exit 1
          echo "Commits to read: $(git rev-list --all --count)"
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --redact --no-banner --exit-code 1 --report-format json --report-path "$RUNNER_TEMP/history.json" --log-opts="--full-history --all --diff-filter=tuxdb -- . $SKIP"
          status=$?
          node -e '
            const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8") || "[]")
            const lines = r.map((f) => `- ${f.RuleID} in ${f.File} line ${f.StartLine}, commit ${String(f.Commit).slice(0, 12)} — fingerprint ${f.Fingerprint}`)
            const head = r.length ? `### Secrets scan: ${r.length} found in the whole history (values redacted)` : "### Secrets scan: nothing found in the whole history"
            console.log([head, ...lines].join("\n"))
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, [head, ...lines, ""].join("\n"))
          ' "$RUNNER_TEMP/history.json" || true
          # Red on a manual run; on a pull request or a push, a warning only (the head of this file says why) — but a
          # scan that could not run at all (no report written) is red everywhere.
          found=$(node -e 'try { console.log(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).length) } catch { console.log(0) }' "$RUNNER_TEMP/history.json")
          if [ "$status" -ne 0 ] && [ "$EVENT" != "workflow_dispatch" ] && [ "$found" -gt 0 ]; then
            echo "::warning title=Secrets in the history::the whole-history scan found something this change did not add — read the run's summary and decide each (raptor-port/docs/gates-and-deploy.md, D1408)"
            exit 0
          fi
          exit $status
