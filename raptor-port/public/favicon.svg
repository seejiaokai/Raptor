<!-- The talon, from the same path Login.tsx and Shell.tsx draw (CLAUDE.md:
     "the talon logo stays"). Copied rather than imported: a favicon is fetched
     as a standalone file before any bundle runs, so this is the one place the
     mark is duplicated. Change the three claw strokes here in the same breath
     as those two components, or the tab and the page stop agreeing.

     Two deliberate departures from the components, both because a tab paints
     this at 16px and the login paints it at 42:
     1. A tile. Bare claws on transparent all but vanish at 16px, and the mark
        sits on whatever colour the browser chrome happens to be. The tile is
        the app's own background, so the icon reads the same on a light or a
        dark tab strip.
     2. A stroke the same colour as the fill, which fattens each claw by about
        a pixel at tab size. Without it the strokes thin out to scratches.
     Colours are literals: no stylesheet is loaded when this is painted, so the
     CSS custom properties the components use would resolve to nothing.
     No double hyphen anywhere in this comment; XML forbids it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="13" fill="#0B0D10"/>
  <g transform="translate(8.7 7.2) scale(0.774) translate(0 2)">
    <path fill="#3BC6E8" stroke="#3BC6E8" stroke-width="2.2" stroke-linejoin="round"
          d="M3 8 Q4.9 38.3 24 62 Q11.5 35.8 3 8 Z M16 0 Q17.4 35.0 42 60 Q26.6 31.0 16 0 Z M31 -2 Q36.4 23.5 58 38 Q42.9 19.1 31 -2 Z" />
  </g>
</svg>
