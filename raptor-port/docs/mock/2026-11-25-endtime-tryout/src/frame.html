<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>End-time try-out</title>
<style>
/* ===== the app's own stylesheets, captured whole from the running build (capture.mjs) ===== */
/*APPCSS*/
</style>
<style>
/*TRYCSS*/
</style>

<body>
<header class="tt-strip" aria-labelledby="ttTitle">
  <div class="tt-in">
    <div class="tt-head">
      <h1 id="ttTitle">Try-out settings</h1>
      <p class="tt-sub">Not part of the app. The day below is Edit Schedule’s Thursday; these switches change how the new rule behaves on it, live.</p>
    </div>
    <div class="tt-groups">
      <div class="tt-grp" role="radiogroup" aria-labelledby="ttA">
        <span class="tt-lbl" id="ttA">Colour while drafting</span>
        <div class="tt-opts">
          <button type="button" class="fchip" data-set="a" data-val="grey" role="radio">Grey, red once signing starts</button>
          <button type="button" class="fchip" data-set="a" data-val="red" role="radio">Red always</button>
        </div>
      </div>
      <div class="tt-grp" role="radiogroup" aria-labelledby="ttB">
        <span class="tt-lbl" id="ttB">Rows with nobody on them, like the dinner</span>
        <div class="tt-opts">
          <button type="button" class="fchip" data-set="b" data-val="never" role="radio">Never block</button>
          <button type="button" class="fchip" data-set="b" data-val="block" role="radio">Block too</button>
        </div>
      </div>
      <div class="tt-grp" role="radiogroup" aria-labelledby="ttC">
        <span class="tt-lbl" id="ttC">An emptied time on a published day</span>
        <div class="tt-opts">
          <button type="button" class="fchip" data-set="c" data-val="red" role="radio">Red at once</button>
          <button type="button" class="fchip" data-set="c" data-val="grey" role="radio">Grey until signing</button>
        </div>
      </div>
      <button type="button" class="tt-reset" id="ttReset" title="Put the day and these settings back to how they started">Reset</button>
    </div>
  </div>
</header>
<main class="tt-stage">
  <div id="root"><div id="shell"><section id="page-editsched" class="page on editing"><div class="edit-inner"><div class="edit-board">
    <div class="week" id="eWeek">
<!--DAY-->
    </div>
  </div></div></section></div></div>
</main>
<script>
/*TRYJS*/
</script>
</body>
</html>
